[tools]
python = "3.15.2"
hk = "2.12.0"
shellcheck = "0.11.0"

[tasks.check]
description = "Run the offline Python checks (texture loading, CI runner)"
run = [
  "python3 tests/libretro-textures/check.py",
  "python3 tests/ci/check.py",
]

[tasks.lint]
description = "Run hk checks on the whole tree"
run = "hk check --all"

[tasks.fix]
description = "Run hk fixers"
run = "hk fix"
