name: Tests

# romlin pushes and all PRs call this from romlin_release.yml at the same commit.
# Each sanitizer lane is split into shards that run in parallel; see
# tests/run-all.sh for how suites are assigned.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    name: ${{ matrix.name }} (shard ${{ matrix.shard }} of 5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Five shards of each lane; keep `shard` and SHARDS below in step.
        # tests/run-all.sh spreads the suites by weight, and its heaviest
        # (smaprx, pgs, spsc) already sit in different shards, so more
        # shards would barely shorten the longest job.
        name: [plain, asan, ubsan]
        shard: [0, 1, 2, 3, 4]
        include:
          - name: plain
            sanitizer: ''
            sanflags: ''
          - name: asan
            sanitizer: address
            sanflags: '-fsanitize=address -fno-omit-frame-pointer'
          # Without -fno-sanitize-recover a UBSan report is printed and
          # the run carries on to a pass, so undefined behaviour never
          # failed this row.
          - name: ubsan
            sanitizer: undefined
            sanflags: '-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install what the suites build against
        run: |
          sudo apt-get update
          # g++-aarch64-linux-gnu: clinkage cross-builds the arm64 recompiler
          # units, which call into C and do not build on this host.
          # gcc-mingw-w64-x86-64: cheaders compiles the C units with
          # <windows.h> included, as MSVC's C mode includes it.
          sudo apt-get install -y build-essential python3 liblzma-dev zlib1g-dev libgl-dev libegl1 libgl1-mesa-dri qemu-utils mame-tools cmake clang libc++-dev libc++abi-dev glslc g++-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Check suite runner behavior
        run: python3 tests/ci/check.py

      # run-all.sh finds every directory with a build.sh, so a suite added
      # later is covered here without touching this file.
      - name: Run the suites
        env:
          SANITIZER: ${{ matrix.sanitizer }}
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          SANFLAGS: ${{ matrix.sanflags }}
          # The concurrency suites are races: a single run of one proves
          # little. The WaitForEmpty failure that reached master showed up
          # about a dozen times in fifty thousand items on a loaded
          # multi-core host and not at all on a quiet single-core one, so
          # the pair runs many times here rather than once.
          WORKSEMA_REPS: 200
          SHARD: ${{ matrix.shard }}
          SHARDS: 5
        run: sh tests/run-all.sh

  # The renderer suites run the built core on lavapipe, and the suites job
  # has no core, so they used to skip in CI. This builds one with
  # Granite's ownership check on (util/owned.hpp: the device takes no
  # lock, and the check aborts if two threads are ever in it at once) and
  # runs them on it.
  renderer:
    name: renderer on a checked core
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install the build and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 liblzma-dev zlib1g-dev libgl-dev libegl1 mesa-vulkan-drivers libvulkan1 glslc

      - name: Build the core with the ownership check
        run: CXXFLAGS=-DGRANITE_OWNERSHIP_CHECK make -j"$(nproc)"

      - name: Run the renderer suites on it
        env:
          LRPS2_CHECKED_CORE: ${{ github.workspace }}/pcsx2_libretro.so
        run: sh tests/pgsowner/build.sh

  # The suites that link a converted C unit, built with mingw-w64 and run
  # under wine. Built from Linux, mingw writes name.exe whatever -o says;
  # a script that then ran "name" ran the last Linux build instead, and
  # passed without ever running the Windows one.
  mingw:
    name: suites built with mingw-w64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install mingw-w64 and wine
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 wine64

      - name: Build and run them as Windows programs
        env:
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          WINEDEBUG: -all
        run: |
          WINE=$(command -v wine || command -v wine64)
          export WINE
          for t in biosver perfmetrics profiler vuops; do
            echo "== $t"
            sh "tests/$t/build.sh"
          done

  # PROFILER=1 adds a source and turns on the PROFILE_* macros in a dozen
  # units, none of which another build compiles: a change that broke them
  # went unseen until someone took a profile.
  profiler:
    name: core with the profiler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install the build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 liblzma-dev zlib1g-dev libgl-dev libegl1

      - name: Build the core with PROFILER=1
        run: make -j"$(nproc)" PROFILER=1

  # The hardware-test suites compare against the PS2 test images and check
  # far less without them. A green tick above should not be read as those
  # having run, so this says which did what.
  report:
    if: always()
    name: what ran
    needs: suites
    runs-on: ubuntu-latest
    env:
      SUITES_RESULT: ${{ needs.suites.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the suites and what each needs
        run: |
          echo "Each lane (plain, asan, ubsan) ran as 5 shards; shard job result: $SUITES_RESULT"
          echo "Built-core suites skip without LRPS2_CORE; core release runs software smoke separately."
          echo "GPU devices and external hardware captures require their prerequisites."
          for d in tests/*/build.sh; do
            s=$(dirname "$d"); s=${s##*/}
            if grep -q 'PS2AUTOTESTS\|PS1TESTS' "$d"; then
              echo "$s: compares against the PS2/PS1 hardware test images; without"
              echo "    PS2AUTOTESTS or PS1TESTS set it checks only that it builds"
            else
              echo "$s: see suite output for runtime prerequisites and skips"
            fi
          done
